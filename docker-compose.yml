version: "3.9"

services:
  table-parser:
    build: .
    container_name: table-parser
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Uncomment for persistent cache (optional):
    # volumes:
    #   - ./cache:/app/cache
